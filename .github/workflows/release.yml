name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Wails App for Windows
        run: wails build -platform windows/amd64 -clean

      - name: Copy alternate binary name
        run: |
          Copy-Item build\bin\lab411-vm-manager.exe build\bin\vm-manager.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab411-vm-manager-windows-amd64
          path: |
            build/bin/lab411-vm-manager.exe
            build/bin/vm-manager.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/bin/lab411-vm-manager.exe
            build/bin/vm-manager.exe
          draft: false
          prerelease: false
          generate_release_notes: true
